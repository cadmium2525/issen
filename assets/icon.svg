<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1c1648"/>
      <stop offset="1" stop-color="#05050c"/>
    </radialGradient>
    <linearGradient id="blade" x1="80" y1="420" x2="432" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ff3ff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#6ff3ff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".8" stop-color="#6ff3ff"/>
      <stop offset="1" stop-color="#6ff3ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 通常型 -->
  <g filter="url(#soft)" opacity=".7">
    <path d="M214 338 L136 372 L156 338 L136 304 Z" fill="#ff2d63"/>
    <circle cx="256" cy="256" r="50" fill="#ff8a00"/>
    <path d="M344 128 L384 151 L384 197 L344 220 L304 197 L304 151 Z" fill="#22c8ff"/>
  </g>
  <path d="M214 338 L136 372 L156 338 L136 304 Z" fill="#ff2d63" stroke="#ffb0c4" stroke-width="4" stroke-linejoin="round"/>
  <!-- 爆弾型 -->
  <g fill="#ffcf6e">
    <path d="M256 196 l10 22 h-20 z"/><path d="M256 316 l10 -22 h-20 z"/>
    <path d="M196 256 l22 10 v-20 z"/><path d="M316 256 l-22 10 v-20 z"/>
    <path d="M213.6 213.6 l23 8 -15 15 z"/><path d="M298.4 298.4 l-23 -8 15 -15 z"/>
    <path d="M298.4 213.6 l-8 23 -15 -15 z"/><path d="M213.6 298.4 l8 -23 15 15 z"/>
  </g>
  <circle cx="256" cy="256" r="40" fill="#ff9a1f" stroke="#ffd89a" stroke-width="4"/>
  <circle cx="256" cy="256" r="21" fill="none" stroke="#3c1200" stroke-width="6"/>
  <circle cx="256" cy="256" r="10" fill="#fff6d6"/>
  <!-- 雷撃型 -->
  <path d="M344 128 L384 151 L384 197 L344 220 L304 197 L304 151 Z" fill="#1a7fd0" stroke="#b4f4ff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M352 142 L330 178 L344 178 L336 206 L360 168 L346 168 Z" fill="#fffbd0"/>
  <!-- 斬撃 -->
  <line x1="80" y1="420" x2="432" y2="92" stroke="url(#blade)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="92" y1="409" x2="420" y2="103" stroke="url(#blade)" stroke-width="9" stroke-linecap="round"/>
</svg>
